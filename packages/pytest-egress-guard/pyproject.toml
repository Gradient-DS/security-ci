[project]
name = "pytest-egress-guard"
version = "1.1.0"
description = "Fail a test when guarded code reaches the network or a sensitive path"
# 3.11, not the tooling repo's 3.12: the consumers are Flask APIs on
# python:3.11-slim, and a plugin they cannot install guards nothing.
requires-python = ">=3.11"
dependencies = ["pytest>=7"]

[project.entry-points.pytest11]
egress_guard = "pytest_egress_guard.plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pytest_egress_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
