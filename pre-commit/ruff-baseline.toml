# Org ruff baseline. Copy into ruff.toml, or under [tool.ruff] in pyproject.toml
# (prefix the tables with `tool.ruff.`). Repos may add rules, never remove these.
# scripts/ruff_baseline.py enforces it in the pre-commit workflow.
line-length = 120
target-version = "py312"   # or the repo's real minimum if higher

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]   # repos may add more (extend), never remove
ignore = ["D100", "D104", "D105", "D107", "D417"]
# D100/D104 module+package docstrings, D105 magic methods, D107 __init__ (document the class),
# D417 "document every arg" (guideline: only list args whose name+type are not enough)

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = ["D1"]          # test names describe themselves; adjust glob to the repo's test layout

[format]
quote-style = "double"
docstring-code-format = true
