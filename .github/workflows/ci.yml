name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # Hygiene, ruff, gitleaks and actionlint from .pre-commit-config.yaml, then
  # the ruff baseline check: this repo's own copy of the shared workflow.
  pre-commit:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/pre-commit.yml
    secrets: inherit

  pytest:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --group dev

      - name: Install gitleaks
        # tests/test_gitleaks_scan_scope.py asserts the scan is scoped to the
        # ref under test by really running gitleaks; without the binary those
        # cases skip and the guard is worthless. Same pinned tag, and the same
        # checksum verification, as security-source.yml installs.
        env:
          GITLEAKS_TAG: v8.30.1
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${GITLEAKS_TAG#v}"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          WORK="$(mktemp -d)"

          # Through the API (`gh release download`), not github.com/.../releases/download:
          # that web route has returned 504 for every repo while the API route kept working.
          gh release download "$GITLEAKS_TAG" -R gitleaks/gitleaks -D "$WORK" \
            -p "$TARBALL" -p "gitleaks_${VERSION}_checksums.txt"

          ( cd "$WORK" && grep " ${TARBALL}\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c - ) || {
            echo "::error::gitleaks ${GITLEAKS_TAG} checksum verification failed"
            exit 1
          }

          tar -xzf "$WORK/$TARBALL" -C /usr/local/bin gitleaks
          rm -rf "$WORK"
          gitleaks version

      - run: uv run pytest -v

  # The required check: reports on every non-draft run, red unless both jobs passed.
  gate:
    needs: [pre-commit, pytest]
    if: ${{ always() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          PRE_COMMIT: ${{ needs.pre-commit.result }}
          PYTEST: ${{ needs.pytest.result }}
        run: |
          echo "pre-commit: $PRE_COMMIT, pytest: $PYTEST"
          test "$PRE_COMMIT" = success && test "$PYTEST" = success
