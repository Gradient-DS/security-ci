name: Security Scanning (source)

on:
  workflow_call:
    inputs:
      python-paths:
        description: 'Space-separated dirs for Bandit. Empty disables the scanner.'
        type: string
        default: ''
      python-requirements:
        description: 'Space-separated requirements files for pip-audit. Ignored when python-uv is true.'
        type: string
        default: ''
      python-uv:
        description: 'Audit the uv lockfile via `uv export` instead of requirements files.'
        type: boolean
        default: false
      node-dirs:
        description: 'Space-separated dirs holding a package-lock.json. Empty disables the scanner.'
        type: string
        default: ''
      trivy-config-paths:
        description: 'Space-separated dirs for `trivy config` (IaC). Empty disables the scanner.'
        type: string
        default: ''
      exceptions-file:
        description: 'Path to the per-repo exception file, relative to the caller repo root.'
        type: string
        default: '.github/security-exceptions.yml'
      tooling-ref:
        description: >-
          Ref of Gradient-DS/security-ci to take the helper scripts from. Defaults to
          the release tag; override to test a paired workflow + helper change on a
          branch, or to keep the helper in step with a caller pinned at @main.
        type: string
        default: 'v1'
    secrets:
      git-token:
        description: >-
          Token with read access to private git dependencies (a requirements
          file pinning `git+https://github.com/<org>/<private-repo>`). pip-audit
          resolves the file in a scratch venv, so pip has to clone the repo;
          without a token the whole audit aborts at that line and nothing after
          it is audited. Handed to git through GIT_CONFIG_* environment
          variables only — no netrc, no file, nothing in the workspace.
        required: false
      SECURITY_CI_APP_ID:
        description: >-
          App ID of the org GitHub App with contents:read on
          Gradient-DS/security-ci, which is where this workflow and the helper
          scripts it checks out live. Optional, so a caller can still run
          against a public checkout of the tooling; without it a private
          tooling repo cannot be read and the job fails at that checkout.
          Named exactly as the organisation secrets are, because `secrets: inherit`
          matches by name: a differently named input stays empty and the checkout
          then falls back to the caller's own token, which cannot read this repo.
        required: false
      SECURITY_CI_APP_PRIVATE_KEY:
        description: 'Private key of the same App. Paired with SECURITY_CI_APP_ID.'
        required: false

env:
  TOOLING_PATH: .security-tooling

jobs:
  # One job, one step per scanner. Each scanner step continues on error and
  # the last step fails the job if any enabled scanner failed, so every
  # scanner still runs and reports on every run — what changed from v5 is
  # only that the scanners no longer each pay for a runner (and a rounded-up
  # billed minute) of their own.
  scan:
    name: Source scans
    runs-on: ubuntu-latest
    env:
      TOOLING_APP_ID: ${{ secrets.SECURITY_CI_APP_ID }}
    outputs:
      failed: ${{ steps.verdict.outputs.failed }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, because gitleaks scans history and not just the tip.
          # This necessarily fetches every ref, which is why the gitleaks scan
          # has to restrict itself to HEAD explicitly.
          fetch-depth: 0

      - id: tooling-token
        # secrets are not readable from a step `if`, so the job exposes the id as env.
        if: env.TOOLING_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SECURITY_CI_APP_ID }}
          private-key: ${{ secrets.SECURITY_CI_APP_PRIVATE_KEY }}
          owner: Gradient-DS
          repositories: security-ci

      - name: Check out shared tooling
        uses: actions/checkout@v6
        with:
          repository: Gradient-DS/security-ci
          token: ${{ steps.tooling-token.outputs.token || github.token }}
          ref: ${{ inputs.tooling-ref }}
          path: ${{ env.TOOLING_PATH }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # ── Exception file ────────────────────────────────────────────────
      - name: Exception file valid and unexpired
        id: exceptions
        continue-on-error: true
        env:
          TOOLING_PATH: ${{ env.TOOLING_PATH }}
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
        run: |
          python "$TOOLING_PATH"/scripts/security_exceptions.py \
            --file "$EXCEPTIONS_FILE" --check-expiry

      # ── Secrets (gitleaks) ────────────────────────────────────────────
      - name: Secrets (gitleaks)
        id: gitleaks
        continue-on-error: true
        env:
          TOOLING_PATH: ${{ env.TOOLING_PATH }}
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
          GITLEAKS_TAG: v8.30.1
          # Written outside the workspace: a `.gitleaksignore` at the repo
          # root would silently overwrite a caller-owned file of that name.
          # --gitleaks-ignore-path accepts either a file or a directory
          # containing a .gitleaksignore; we point it straight at the
          # generated file. Confirmed against the pinned v8.30.1 binary via
          # `gitleaks git --help`.
          GITLEAKSIGNORE_PATH: ${{ runner.temp }}/security-exceptions.gitleaksignore
        run: |
          # pipefail: the default shell is `bash -e {0}`, so without this a
          # failing curl in `curl | tar` is masked by tar's exit status.
          set -euo pipefail

          python "$TOOLING_PATH"/scripts/security_exceptions.py \
            --file "$EXCEPTIONS_FILE" \
            --emit-gitleaksignore "$GITLEAKSIGNORE_PATH"

          VERSION="${GITLEAKS_TAG#v}"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_TAG}"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          WORK="$(mktemp -d)"

          # Download, then verify against the checksums file published with the
          # release, then extract. `gitleaks version` only catches a truncated
          # download; it cannot detect a substituted binary.
          curl -sSfL -o "$WORK/$TARBALL" "$BASE/$TARBALL"
          curl -sSfL -o "$WORK/checksums.txt" "$BASE/gitleaks_${VERSION}_checksums.txt"

          ( cd "$WORK" && grep " ${TARBALL}\$" checksums.txt | sha256sum -c - ) || {
            echo "::error::gitleaks ${GITLEAKS_TAG} checksum verification failed — refusing to run an unverified binary"
            exit 1
          }

          tar -xzf "$WORK/$TARBALL" -C "$WORK" gitleaks
          GITLEAKS="$WORK/gitleaks"
          "$GITLEAKS" version

          # --log-opts is REQUIRED here; without it the scan is not scoped to
          # this run's ref.
          #
          # `gitleaks git` runs `git log -p -U0 <log-opts>` and, given no
          # --log-opts, defaults those options to `--full-history --all`.
          # `--all` means every ref in the repository — and the checkout above
          # uses fetch-depth: 0, which fetches every branch. A PR therefore
          # failed on secrets committed to somebody else's unmerged branch,
          # which the PR author cannot fix and which no exception can durably
          # suppress: the fingerprint contains a commit SHA, so it changes the
          # moment that branch is squash-merged and the same content then
          # reappears on the default branch under a new fingerprint.
          #
          # Replacing the default with `--full-history HEAD` scopes the scan to
          # commits reachable from this run's ref, which is what a gate should
          # depend on:
          #   pull_request -> the merge commit: base history + the PR's commits
          #   push         -> the pushed branch
          #   schedule     -> the default branch
          #
          # This is a narrowing of the ref set only, NOT a narrowing to the PR
          # diff. Full history behind HEAD is still scanned, root commits
          # included, so a secret committed and later deleted still fails the
          # gate — verified against the pinned v8.30.1 binary.
          "$GITLEAKS" git . --redact --exit-code 1 --verbose \
            --log-opts="--full-history HEAD" \
            --gitleaks-ignore-path "$GITLEAKSIGNORE_PATH"

      # ── Python SAST (Bandit) ──────────────────────────────────────────
      - name: Python SAST (Bandit)
        id: bandit
        if: inputs.python-paths != ''
        continue-on-error: true
        env:
          PYTHON_PATHS: ${{ inputs.python-paths }}
        run: |
          pip install bandit
          # shellcheck disable=SC2086
          bandit -r $PYTHON_PATHS -ll --confidence-level=medium \
            -x '*/node_modules/*,*/.venv/*,*/dist/*,*/.worktrees/*,*/.wt-*,*/tests/*'

      # ── Python dependencies (pip-audit) ───────────────────────────────
      - name: Install uv
        id: setup-uv
        if: inputs.python-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      # Only what pip downloads to resolve the hand-written files. The
      # advisory lookups go to a fresh per-run cache (--cache-dir below), so
      # no restored entry can answer a vulnerability query.
      - name: Key the pip cache
        id: pip-cache-key
        if: inputs.python-requirements != '' && !inputs.python-uv
        env:
          PYTHON_REQS: ${{ inputs.python-requirements }}
        run: |
          # shellcheck disable=SC2086
          echo "hash=$(cat $PYTHON_REQS 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        if: inputs.python-requirements != '' && !inputs.python-uv
        with:
          path: ~/.cache/pip
          key: pip-audit-${{ runner.os }}-${{ steps.pip-cache-key.outputs.hash }}
          restore-keys: pip-audit-${{ runner.os }}-

      - name: Python Dependencies (pip-audit)
        id: pip-audit
        if: inputs.python-requirements != '' || inputs.python-uv
        continue-on-error: true
        env:
          TOOLING_PATH: ${{ env.TOOLING_PATH }}
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
          PYTHON_UV: ${{ inputs.python-uv }}
          PYTHON_REQS: ${{ inputs.python-requirements }}
          VULN_CACHE: ${{ runner.temp }}/pip-audit-vuln-cache
          # A private git pin makes pip shell out to git for a clone. The token
          # reaches git through its environment-variable config only, and only
          # in this step; without a token GIT_CONFIG_COUNT is 0 and git reads
          # none of it.
          GIT_CONFIG_COUNT: ${{ secrets.git-token != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.git-token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          pip install pip-audit
          PIP_AUDIT_ARGS=$(python "$TOOLING_PATH"/scripts/security_exceptions.py \
                             --file "$EXCEPTIONS_FILE" --emit-args)
          export PIP_AUDIT_ARGS

          FILES="$PYTHON_REQS"
          if [ "$PYTHON_UV" = "true" ]; then
            uv export --format requirements-txt --no-emit-project \
              --no-hashes --all-extras --no-dev > /tmp/uv-reqs.txt
            FILES=/tmp/uv-reqs.txt
          fi

          # A file that already lists its full closure (uv-generated, every
          # requirement pinned) is audited as listed: --no-deps --disable-pip,
          # no venv, no resolve. Any other file is resolved in a scratch venv
          # exactly as before, because its pins are not the whole closure.
          # shellcheck disable=SC2086
          PLAN=$(python "$TOOLING_PATH"/scripts/requirements_closure.py $FILES)
          echo "$PLAN"

          LOGS=$(mktemp -d)
          audit() { # mode file -> writes <log>.out and <log>.rc
            local mode=$1 f=$2 log frc=0
            log="$LOGS/$(printf '%s' "$f" | tr '/' '_')"
            # `|| frc=$?`: the step shell runs with -e, which would otherwise
            # end the loop at the first file with a finding.
            if [ "$mode" = "no-deps" ]; then
              # shellcheck disable=SC2086
              pip-audit --desc on --cache-dir "$VULN_CACHE" -r "$f" --no-deps --disable-pip $PIP_AUDIT_ARGS > "$log.out" 2>&1 || frc=$?
            else
              # shellcheck disable=SC2086
              pip-audit --desc on --cache-dir "$VULN_CACHE" -r "$f" $PIP_AUDIT_ARGS > "$log.out" 2>&1 || frc=$?
            fi
            echo "$frc" > "$log.rc"
          }
          export -f audit
          export LOGS VULN_CACHE

          # The resolving audits are independent scratch venvs, so they run
          # four at a time; the --no-deps ones take seconds and run serially.
          # shellcheck disable=SC2016 # $1 is expanded by the inner bash
          printf '%s\n' "$PLAN" | awk -F'\t' '$1=="resolve"{print $2}' \
            | xargs -r -P 4 -I{} bash -c 'audit resolve "$1"' _ {}
          printf '%s\n' "$PLAN" | awk -F'\t' '$1=="no-deps"{print $2}' \
            | while IFS= read -r f; do audit no-deps "$f"; done

          # Every file is audited even after one fails, so a single run
          # reports every offending file; the accumulator keeps a later clean
          # file from masking an earlier failure. A file with no recorded exit
          # status was never audited, and fails closed.
          rc=0
          # shellcheck disable=SC2086
          for f in $FILES; do
            log="$LOGS/$(printf '%s' "$f" | tr '/' '_')"
            echo "::group::pip-audit $f"
            cat "$log.out" 2>/dev/null
            echo "::endgroup::"
            frc=$(cat "$log.rc" 2>/dev/null || echo missing)
            if [ "$frc" != "0" ]; then
              echo "::error::pip-audit $f failed (exit $frc)"
              rc=1
            fi
          done
          exit "$rc"

      # ── Node dependencies (npm audit) ─────────────────────────────────
      - name: Install Node
        id: setup-node
        if: inputs.node-dirs != ''
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Node Dependencies (npm audit)
        id: npm-audit
        if: inputs.node-dirs != ''
        continue-on-error: true
        env:
          # Values reach the shell through env, never interpolated into the
          # script text: a `${{ }}` substitution happens BEFORE the shell parses
          # the line, so metacharacters in a value would execute. NODE_DIRS is
          # expanded unquoted on purpose — word-splitting is wanted, command
          # substitution is not, and expansion results are never re-evaluated.
          NODE_DIRS: ${{ inputs.node-dirs }}
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
          TOOLING: ${{ env.TOOLING_PATH }}
        run: |
          # pipefail is safe alongside the deliberate `|| true` below: that
          # `|| true` covers a plain command group, not a pipeline, so npm's
          # non-zero exit on findings is still ignored while a genuine npm
          # failure is caught downstream — npm writes {"error": {...}} instead
          # of a `vulnerabilities` report, and the helper fails closed on that.
          set -o pipefail

          for d in $NODE_DIRS; do
            echo "::group::npm audit $d"
            AUDIT_JSON="$(mktemp)"
            ( cd "$d" && npm ci --ignore-scripts ) || {
              echo "::error::npm ci failed in $d — cannot audit, failing closed"
              rm -f "$AUDIT_JSON"
              exit 1
            }
            ( cd "$d" && npm audit --json ) > "$AUDIT_JSON" || true
            python "$TOOLING/scripts/security_exceptions.py" \
              --file "$EXCEPTIONS_FILE" \
              --npm-audit-json "$AUDIT_JSON"
            rm -f "$AUDIT_JSON"
            echo "::endgroup::"
          done

      # ── IaC (trivy config) ────────────────────────────────────────────
      # `trivy config` takes exactly one target, but trivy-config-paths is
      # documented as space-separated and one repo needs four roots. The action
      # cannot be run a variable number of times, so install the same pinned
      # trivy the action would install (trivy-action@v0.36.0 ships v0.70.0) and
      # loop the CLI.
      - name: Install trivy
        id: setup-trivy
        if: inputs.trivy-config-paths != ''
        continue-on-error: true
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: IaC (trivy config)
        id: trivy-config
        if: inputs.trivy-config-paths != ''
        continue-on-error: true
        env:
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
          TOOLING: ${{ env.TOOLING_PATH }}
          # Written outside the workspace: `.trivyignore` at the repo root would
          # silently overwrite a caller-owned file of that name.
          TRIVYIGNORE_BASE: ${{ runner.temp }}/security-exceptions.trivyignore
          # Unquoted expansion below is deliberate: word-splitting is wanted,
          # command substitution is not.
          TRIVY_CONFIG_PATHS: ${{ inputs.trivy-config-paths }}
        run: |
          set -uo pipefail

          # The helper chooses the file FORMAT and therefore the file NAME:
          # trivy's plain one-id-per-line format at $TRIVYIGNORE_BASE when no
          # exception is path-scoped, and trivy's YAML format at
          # "$TRIVYIGNORE_BASE.yaml" when one is -- trivy selects its parser by
          # extension. It prints the path it wrote, and that is the only thing
          # it prints, so capturing stdout is the contract.
          TRIVYIGNORE_PATH=$(python "$TOOLING/scripts/security_exceptions.py" \
                               --file "$EXCEPTIONS_FILE" \
                               --emit-trivyignore "$TRIVYIGNORE_BASE") || exit 1

          # Every path is scanned even after one fails, so a single run reports
          # every offending root; the accumulator makes sure a later clean path
          # cannot mask an earlier failure.
          rc=0
          # shellcheck disable=SC2086
          for p in $TRIVY_CONFIG_PATHS; do
            echo "::group::trivy config $p"
            if [ ! -e "$p" ]; then
              echo "::error::trivy config path '$p' does not exist — failing closed rather than reporting a clean scan"
              rc=1
              echo "::endgroup::"
              continue
            fi
            trivy config "$p" \
              --severity CRITICAL,HIGH \
              --exit-code 1 \
              --ignorefile "$TRIVYIGNORE_PATH" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

      # ── Verdict ───────────────────────────────────────────────────────
      - name: Fail if any scanner failed
        id: verdict
        if: always()
        env:
          # A scanner counts as failed unless every one of its steps ran and
          # succeeded. An enabled scanner whose step was skipped (an earlier
          # step of the job failed) fails too: a scan that did not run is not
          # a clean scan.
          EXCEPTIONS: ${{ steps.exceptions.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          BANDIT: ${{ steps.bandit.outcome }}
          BANDIT_ON: ${{ inputs.python-paths != '' }}
          PIP_AUDIT: ${{ steps.pip-audit.outcome }}
          SETUP_UV: ${{ steps.setup-uv.outcome }}
          PIP_AUDIT_ON: ${{ inputs.python-requirements != '' || inputs.python-uv }}
          NPM_AUDIT: ${{ steps.npm-audit.outcome }}
          SETUP_NODE: ${{ steps.setup-node.outcome }}
          NPM_AUDIT_ON: ${{ inputs.node-dirs != '' }}
          TRIVY_CONFIG: ${{ steps.trivy-config.outcome }}
          SETUP_TRIVY: ${{ steps.setup-trivy.outcome }}
          TRIVY_CONFIG_ON: ${{ inputs.trivy-config-paths != '' }}
          PYTHON_UV: ${{ inputs.python-uv }}
        run: |
          failed=()
          report() { # name enabled outcome...
            local name=$1 on=$2; shift 2
            local verdict=success o
            if [ "$on" != "true" ]; then
              verdict=disabled
            else
              for o in "$@"; do [ "$o" = "success" ] || verdict="failure ($o)"; done
            fi
            echo "| $name | $verdict |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name: $verdict"
            case "$verdict" in success|disabled) ;; *) failed+=("$name") ;; esac
          }
          { echo "### Source scans"; echo; echo "| Scanner | Result |"; echo "| --- | --- |"; } >> "$GITHUB_STEP_SUMMARY"
          report exceptions true "$EXCEPTIONS"
          report gitleaks true "$GITLEAKS"
          report bandit "$BANDIT_ON" "$BANDIT"
          if [ "$PYTHON_UV" = "true" ]; then
            report pip-audit "$PIP_AUDIT_ON" "$SETUP_UV" "$PIP_AUDIT"
          else
            report pip-audit "$PIP_AUDIT_ON" "$PIP_AUDIT"
          fi
          report npm-audit "$NPM_AUDIT_ON" "$SETUP_NODE" "$NPM_AUDIT"
          report trivy-config "$TRIVY_CONFIG_ON" "$SETUP_TRIVY" "$TRIVY_CONFIG"

          joined=$(IFS=,; echo "${failed[*]}")
          echo "failed=$joined" >> "$GITHUB_OUTPUT"
          if [ -n "$joined" ]; then
            echo "::error::Failed scanners: $joined"
            exit 1
          fi

  notify-scheduled-failure:
    name: Notify on scheduled failure
    needs: [scan]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      # `issues: write` alone drops the implicit `contents: read`, which the two
      # checkout steps below need.
      contents: read
      issues: write
    env:
      TOOLING_APP_ID: ${{ secrets.SECURITY_CI_APP_ID }}
    steps:
      - id: tooling-token
        # secrets are not readable from a step `if`, so the job exposes the id as env.
        if: env.TOOLING_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SECURITY_CI_APP_ID }}
          private-key: ${{ secrets.SECURITY_CI_APP_PRIVATE_KEY }}
          owner: Gradient-DS
          repositories: security-ci

      - uses: actions/checkout@v6
        with:
          repository: Gradient-DS/security-ci
          token: ${{ steps.tooling-token.outputs.token || github.token }}
          ref: ${{ inputs.tooling-ref }}
          path: .security-tooling
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The scanners that failed, as the scan job's verdict step named
          # them; empty when the job died before reaching it.
          FAILED_JOBS: ${{ needs.scan.outputs.failed }}
          TOOLING: .security-tooling
        run: |
          # pipefail: without it a failing `printf`/`gh` in the pipelines below
          # is masked by jq's exit status, and the notifier would act on an
          # empty job list or an empty issue list.
          set -o pipefail

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          export REPO_NAME

          python -c 'import os,sys; sys.path.insert(0,os.environ["TOOLING"]); from scripts.notify_scheduled_failure import issue_title; print(issue_title(os.environ["REPO_NAME"]),end="")' > /tmp/issue-title.txt
          python -c 'import os,sys; sys.path.insert(0,os.environ["TOOLING"]); from scripts.notify_scheduled_failure import issue_body; failed=[j for j in os.environ["FAILED_JOBS"].split(",") if j]; print(issue_body(os.environ["REPO_NAME"],os.environ["RUN_URL"],failed),end="")' > /tmp/issue-body.md

          TITLE=$(cat /tmp/issue-title.txt)

          # Idempotent: `gh label create` exits non-zero if the label already
          # exists, which is fine. Without this the notifier dies on any repo
          # that has never had a `security` label.
          gh label create security --color B60205 \
            --description "Automated security scan findings" 2>/dev/null || true

          # Exact title match via jq — `gh issue list --search` is fuzzy
          # full-text and can match an unrelated issue or miss the real one.
          EXISTING=$(gh issue list --state open --label security --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md --label security
          fi
