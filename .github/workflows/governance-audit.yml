name: Governance audit

# Nightly: checks every Gradient-DS repo against its `tier` and `branch_model`
# (governance/README.md, "Audit") and keeps one `Governance audit: <repo>` issue
# per repo in step. The App token reads every repo and writes those issues; the
# workflow's own GITHUB_TOKEN only checks out this repository.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the findings and the summary; open, update or close no issue
        type: boolean
        default: false

permissions: {}

concurrency:
  group: governance-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit the org
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GOVERNANCE_APP_ID }} # the App ID is accepted as JWT issuer
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Gradient-DS

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'

      - name: Run the audit
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          uv run --no-dev python -m scripts.governance_audit "${args[@]}"
