name: Check for a tested tree
description: >-
  Answers whether a passing run of this workflow already tested exactly the
  tree of the commit being pushed, as recorded by `tested-tree/record`.
  hit=true ONLY on an exact tree match recorded by a same-repository
  pull_request run of this workflow file. See README.md.
inputs:
  workflow-key:
    description: 'The key the record was made under. [A-Za-z0-9._-] only.'
    required: true
  sha:
    description: 'The commit whose tree to look up. Default: github.sha, the pushed commit.'
    default: ${{ github.sha }}
  token:
    description: 'Token with contents: read and actions: read on this repository.'
    default: ${{ github.token }}
outputs:
  hit:
    description: >-
      'true' only when a record for exactly this tree was uploaded by a
      pull_request run, from a branch of this repository, of this same
      workflow file; else 'false'.
    value: ${{ steps.check.outputs.hit }}
  tree:
    description: 'The tree id that was looked up.'
    value: ${{ steps.check.outputs.tree }}
  run-url:
    description: 'The run that recorded the tree, on a hit.'
    value: ${{ steps.check.outputs.run-url }}
runs:
  using: composite
  steps:
    - name: Look up the tree
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KEY: ${{ inputs.workflow-key }}
        SHA: ${{ inputs.sha }}
        # owner/repo/.github/workflows/x.yml@ref -> .github/workflows/x.yml
        WORKFLOW_REF: ${{ github.workflow_ref }}
      # The logic lives in scripts/tested_tree.py, tested in
      # tests/test_tested_tree.py. The action directory is part of a full
      # checkout of this repository at the pinned ref, so the script is the
      # one from the same commit.
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/tested_tree.py" check
