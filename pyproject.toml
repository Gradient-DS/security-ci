[project]
name = "gradient-ci-tooling"
version = "1.0.0"
description = "Helper scripts for Gradient-DS reusable security workflows"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2"]

[dependency-groups]
# pytest-egress-guard ships from this repo; installing it here is what puts
# its `deny_egress` fixture on the pytest11 entry point, so CI exercises the
# same delivery path a consuming repo uses rather than a local import.
# hostile-corpus ships from here too, for the same reason: without it in this
# group and in testpaths below, the root `uv run pytest -v` that CI runs never
# imports or collects it, so a PR that guts the corpus merges clean.
# openapi-surface was extracted in #16 without being added here, so its tests
# have never run in this repo's CI -- the exact failure the previous sentence
# describes, already happened once.
dev = ["pytest>=8.3.0", "pytest-egress-guard", "hostile-corpus", "openapi-surface"]

[tool.uv.sources]
pytest-egress-guard = { path = "packages/pytest-egress-guard", editable = true }
hostile-corpus = { path = "packages/hostile-corpus", editable = true }
openapi-surface = { path = "packages/openapi-surface", editable = true }

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/pytest-egress-guard/tests",
    "packages/hostile-corpus/tests",
    "packages/openapi-surface/tests",
]
pythonpath = ["."]

# Org ruff baseline (pre-commit/ruff-baseline.toml).
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["D100", "D104", "D105", "D107", "D417"]
unfixable = ["D403"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
"packages/*/tests/**" = ["D1"]
# Lint debt (2026-11-06 baseline). Remove entries as files are fixed; never add new ones.
"packages/hostile-corpus/tests/test_corpus.py" = ["D205"]
"packages/openapi-surface/openapi_surface/__init__.py" = ["D205"]
"packages/openapi-surface/tests/test_writable_fields.py" = ["D205"]
"packages/pytest-egress-guard/pytest_egress_guard/plugin.py" = ["D102", "D103"]
"packages/pytest-egress-guard/tests/test_plugin.py" = ["SIM115"]
"scripts/governance.py" = ["D103"]
"scripts/governance_audit.py" = ["B905", "D101", "D102", "D103", "E741"]
"scripts/linear_link.py" = ["D103"]
"scripts/requirements_closure.py" = ["D103", "D301"]
"scripts/runtime_gate.py" = ["D103"]
"scripts/security_exceptions.py" = ["D101", "D103"]
"scripts/tested_tree.py" = ["D103"]
"tests/test_gitleaks_scan_scope.py" = ["D205"]
"tests/test_runtime_gate.py" = ["D205"]
"tests/test_security_exceptions.py" = ["D205", "D301", "E402", "E741"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
